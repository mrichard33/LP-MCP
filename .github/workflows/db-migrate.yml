name: Database migrations (LP Supabase)
# The one path for schema changes to the LP project (ref rcjcgjlqzepicbwhnnjl).
#
# 2026-10-12 (Fix 1): until this file, 157 numbered sql/ files were pasted into
# the Supabase SQL editor by hand and the database's own migration table knew
# about 8 of them. Five repositories wrote tables into this one database with
# no shared record. From here on:
#
#   pull request touching supabase/   -> "check": names must be valid, no
#                                        destructive statement without an
#                                        approval marker, and the local ledger
#                                        must agree with the database's (and,
#                                        once a baseline dump exists, the schema
#                                        itself must not have drifted).
#   merge to main with new migrations -> "push": `supabase db push` applies
#                                        exactly the files the database has not
#                                        recorded, in version order.
#   manual run, action = baseline     -> "baseline": dumps the live schema into
#                                        one timestamped file, marks it applied,
#                                        and opens a PR with it. Run this ONCE
#                                        after the secrets are set; the drift
#                                        check is informational until it merges.
#
# Secrets (repository secrets, Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from
#                          https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the project's database password
#                          (Project Settings > Database > Database password)
# The password never appears in logs: the CLI reads it from the environment.
#
# Why the push job refuses DROP / TRUNCATE / ALTER COLUMN TYPE without a
# marker: sql/README.md has always said a person watches those. The marker is
# the line `-- destructive: approved by <name> <YYYY-MM-DD>` inside the file.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/check-migrations.js'
      - '.github/workflows/db-migrate.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'check = compare repo and database; baseline = dump the live schema into a new migration and open a PR'
        type: choice
        options: [check, baseline]
        default: check

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: rcjcgjlqzepicbwhnnjl
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  check:
    name: Ledger check
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pure checks first: file names, duplicate versions, destructive markers.
      # These need no secrets, so a fork or a PR from a new contributor still
      # gets an answer.
      - name: Validate migration files
        run: node scripts/check-migrations.js --base origin/${{ github.base_ref || 'main' }}

      - name: Secrets visible to this job?
        id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set; skipping the live comparison. Add both as repository secrets (Settings > Secrets and variables > Actions)."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Link to the LP project
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Every version the database lists must exist here, and vice versa for
      # anything already merged. A mismatch is the exact state this workflow
      # was written to end.
      - name: Compare the repo ledger with the database ledger
        if: steps.secrets.outputs.ok == 'true'
        run: |
          supabase migration list --linked | tee migration-list.txt
          node scripts/check-migrations.js --migration-list migration-list.txt

      # Schema drift is only meaningful once a baseline dump exists: before
      # that the shadow database built from the stubs is empty by design.
      - name: Schema drift (only after a baseline exists)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if ! ls supabase/migrations/*_baseline_dump.sql >/dev/null 2>&1; then
            echo "No *_baseline_dump.sql yet; run this workflow manually with action=baseline. Skipping the drift check."
            exit 0
          fi
          # 2026-10-12: this line used to end in `|| true`, so when the shadow
          # rebuild failed ("type public.vector does not exist") the diff wrote
          # nothing and the step printed "No drift." with no comparison run.
          # A diff that cannot run is a failure, never a clean bill.
          if ! supabase db diff --linked --schema public,ai_os > drift.sql; then
            echo "::error::The drift check could not run (see the error above), so nothing was compared. Fix the cause; do not read this as no drift."
            exit 1
          fi
          # check-migrations.js drops only the pinned build artefacts in
          # KNOWN_DRIFT_NOISE (each by the hash of its exact statement) and
          # fails on anything else.
          if ! node scripts/check-migrations.js --drift drift.sql; then
            echo "::error::The live schema differs from the migrations in this repo. Either add a migration for the change, or someone changed the database by hand."
            cat drift.sql
            exit 1
          fi

  push:
    name: Apply new migrations
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate migration files (destructive statements need a marker)
        run: node scripts/check-migrations.js --base "${{ github.event.before }}"
      - name: Secrets present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD are not set, so nothing was applied. Set both repository secrets and re-run this job."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply
        run: supabase db push --linked
      - name: Ledger after push
        run: supabase migration list --linked

  baseline:
    name: Dump the live schema into a baseline migration
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'baseline'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD are not set. Set both repository secrets first."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Dump schema (public + ai_os, no data)
        id: dump
        run: |
          if ls supabase/migrations/*_baseline_dump.sql >/dev/null 2>&1; then
            echo "::error::A baseline dump already exists. Delete it in a PR first if you really want a new one."
            exit 1
          fi
          VERSION="$(date -u +%Y%m%d%H%M%S)"
          FILE="supabase/migrations/${VERSION}_baseline_dump.sql"
          supabase db dump --linked --schema public,ai_os -f "$FILE"
          {
            echo "-- ${VERSION}_baseline_dump"
            echo "--"
            echo "-- Schema of the LP project as dumped by \`supabase db dump\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "-- Everything in sql/NNN_*.sql, sql/migrations/, and the other repos' hand-applied"
            echo "-- files up to this date is captured here. Recorded as APPLIED in the database"
            echo "-- by this same workflow run (supabase migration repair), so \`db push\` never"
            echo "-- executes it against production. A fresh database is built from it."
            echo "--"
            # The dump leaves out what a fresh database needs first (2026-10-12):
            # the vector extension (in public), pg_trgm (in extensions) and the
            # lf_report_svc role its GRANTs name.
            echo 'CREATE EXTENSION IF NOT EXISTS "vector" WITH SCHEMA "public";'
            echo 'CREATE EXTENSION IF NOT EXISTS "pg_trgm" WITH SCHEMA "extensions";'
            echo "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'lf_report_svc') THEN CREATE ROLE \"lf_report_svc\" NOLOGIN; END IF; END \$\$;"
            cat "$FILE"
          } > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          supabase migration repair --linked --status applied "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          wc -c "$FILE"
      - name: Open a PR with the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="chore/db-baseline-${{ steps.dump.outputs.version }}"
          git checkout -b "$BR"
          git add "${{ steps.dump.outputs.file }}"
          git commit \
            -m "chore(db): baseline dump of the LP schema (${{ steps.dump.outputs.version }})" \
            -m "WHAT: one migration holding the live schema of the LP project (public + ai_os), produced by supabase db dump and recorded as applied." \
            -m "WHY: the migrations ledger needs a true starting point; the 157 hand-applied sql/ files cannot be replayed. From this file forward every schema change is a migration in supabase/migrations/ and the drift check is meaningful." \
            -m "IMPACT: none at runtime. Nothing was executed against the database."
          git push -u origin "$BR"
          # 2026-10-12: the repo setting "Allow GitHub Actions to create pull
          # requests" is off, so gh pr create was refused AFTER the dump, the
          # repair and the push had all succeeded, and the run read as failed.
          # The branch is the deliverable; a refused PR is a notice, not a failure.
          gh pr create --base main --head "$BR" \
            --title "chore(db): baseline dump of the LP schema" \
            --body "Produced by the db-migrate workflow (action=baseline). Review that the file is the schema you expect, then merge. The database already lists this version as applied, so merging runs nothing against production; it only makes the drift check live." \
          || echo "::notice::Branch $BR is pushed, but GitHub Actions may not open pull requests in this repo. Open one from https://github.com/${{ github.repository }}/pull/new/$BR"
